sherlock-trivy-fs-save:
  tags: ["app"]
  extends: .sherlock-template-save
  needs: ["sca-trivy"]
  dependencies:
    - sca-trivy
  variables:
    SHER_SCANNER_ARTIFACT_FILE: trivy-fs.json
    SHER_SCANNER_CODE: custom_scanner_sca_8f673df7
    #GIT_STRATEGY: none
  before_script:
    - SHERLOCK_START_SCANNER_SCAN_DATE=$SHERLOCK_START_TRIVY_FS_SCAN_DATE
    - SHERLOCK_END_SCANNER_SCAN_DATE=$SHERLOCK_END_TRIVY_FS_SCAN_DATE


