secrets-gitleaks:
  allow_failure: true
  tags: ["app"]
  stage: pre-build
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  before_script:
    # Переменная для Шерлок, чтобы правильно отображать завершение сканирования инструментом
    - echo "SHERLOCK_START_GITLEAKS_SCAN_DATE=$(date -d "@$(( $(date +%s) + 10800 ))" -Iseconds)" >> sherlock_scan_date.env
  script:
    - gitleaks detect --source . --report-path gitleaks.json
  after_script:
    # Переменная для Шерлок, чтобы правильно отображать завершение сканирования инструментом
    - echo "SHERLOCK_END_GITLEAKS_SCAN_DATE=$(date -d "@$(( $(date +%s) + 10800 ))" -Iseconds)" >> sherlock_scan_date.env
  artifacts:
    when: always
    paths: [gitleaks.json]
    reports:
      dotenv: sherlock_scan_date.env

sherlock-gitleaks-save:
  extends: .sherlock-template-save
  needs: ["secrets-gitleaks"]
  dependencies:
    - secrets-gitleaks
  variables:
    SHER_SCANNER_ARTIFACT_FILE: gitleaks.json
    SHER_SCANNER_CODE: gitleaks
    #GIT_STRATEGY: none
  before_script:
    # Переопределение переменных для Шерлок под запрос в шаблоне (.sherlock-template-save), чтобы правильно отображать завершение сканирования по инструменту
    - SHERLOCK_START_SCANNER_SCAN_DATE=$SHERLOCK_START_GITLEAKS_SCAN_DATE
    - SHERLOCK_END_SCANNER_SCAN_DATE=$SHERLOCK_END_GITLEAKS_SCAN_DATE

build-opengrep-image:
  allow_failure: true
  stage: pre-build
  image: docker:latest
  tags: ["app"]
  services:
    - docker:dind
  script:
    - |
      cat << 'EOF' > Dockerfile.opengrep
      FROM debian:bookworm-slim
      ENV LANG=C.UTF-8
      RUN apt-get update && apt-get install -y curl ca-certificates && rm -rf /var/lib/apt/lists/*
      ARG TARGETARCH
      RUN if [ "$TARGETARCH" = "arm64" ]; then \
              DIST="opengrep_manylinux_aarch64"; \
          else \
              DIST="opengrep_manylinux_x86"; \
          fi && \
          curl -L -o /usr/local/bin/opengrep \
          "https://github.com/opengrep/opengrep/releases/download/v1.16.3/${DIST}" && \
          chmod +x /usr/local/bin/opengrep
      WORKDIR /app
      ENTRYPOINT ["opengrep"]
      CMD ["--help"]
      EOF
    - docker build -t my-opengrep-image -f Dockerfile.opengrep .
    - docker save -o opengrep-image.tar my-opengrep-image
  artifacts:
    paths:
      - opengrep-image.tar

sast-opengrep:
  stage: pre-build
  image: docker:latest
  tags: ["app"]
  services:
    - docker:dind
  needs: ["build-opengrep-image"]
  script:
    - docker load -i opengrep-image.tar
    - echo "SHERLOCK_START_OPENGREP_SCAN_DATE=$(date -d "@$(( $(date +%s) + 10800 ))" -Iseconds)" >> sherlock_scan_date.env
    - docker run --rm -v $(pwd):/app my-opengrep-image scan --taint-intrafile --config auto --no-git-ignore --json -o sast-opengrep.json /app || true
  after_script:
    - echo "SHERLOCK_END_OPENGREP_SCAN_DATE=$(date -d "@$(( $(date +%s) + 10800 ))" -Iseconds)" >> sherlock_scan_date.env
  artifacts:
    paths: [sast-opengrep.json]
    reports:
      dotenv: sherlock_scan_date.env
    when: always
  allow_failure: true

sherlock-opengrep-save:
  extends: .sherlock-template-save
  needs: ["sast-opengrep"]
  dependencies:
    - sast-opengrep
  variables:
    SHER_SCANNER_ARTIFACT_FILE: sast-opengrep.json
    # Это не ошибка, парсер будет тот же
    SHER_SCANNER_CODE: semgrep
    #GIT_STRATEGY: none
  before_script:
    - SHERLOCK_START_SCANNER_SCAN_DATE=$SHERLOCK_START_OPENGREP_SCAN_DATE
    - SHERLOCK_END_SCANNER_SCAN_DATE=$SHERLOCK_END_OPENGREP_SCAN_DATE

#  --config "https://github.com/0xdea/semgrep-rules" 

